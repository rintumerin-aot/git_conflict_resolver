detect_conflicts_task:
  description: >
    You are given a log file located at `{log_file_path}` that contains a list of relative file paths.
    List the files paths from the log file.

      Your job is to:
        1. Read each line in the file to get the relative file path.
        2. For each resulting full file path:
          - Check if the file exists.
          - Read its contents.
          - Determine if it contains unresolved Git merge conflict markers:
            - "<<<<<<<"
            - "======="
            - ">>>>>>>"
        4. Prepare a clean list of only the files that contain **all three markers**.

      Your final answer MUST be:
        - A numbered list of all the full file paths from the log file.
        - If no conflicts are found, respond with: "No merge conflicts found."

  expected_output: >
    A list of valid file paths containing '<<<<<<<', '=======', and '>>>>>>>' markers.
  agent: conflict_detector

resolve_conflicts_task:
  description: >
    Your goal is to merge these changes intelligently, preserving the intended functionality and logic while removing redundant or conflicting lines.

    The final result must be a fully resolved file with no merge markers.
    Use the `Fix Merge Conflicts in File` tool to overwrite the original file with the resolved content.

    Your output must be the complete, corrected content of the file.

  expected_output: >
    A valid, conflict-free version of the file, saved successfully with all merge conflict markers resolved.
  context: [detect_conflicts_task]
  agent: conflict_resolver
  human_input: true

summary_task:
  description: >
    Generate a comprehensive conflict resolution summary report using the ConflictSummaryTool.
    Use the tool to analyze all results and generate both markdown and JSON reports.
    Ensure proper prioritization of files needing manual review.

  expected_output: >
    Generate a comprehensive summary report for the entire operation. Also, list down the files for manual review if any conflicts remain unresolved.
  context:
    - detect_conflicts_task
    - resolve_conflicts_task
  agent: summary_reporter
  output_file: output/conflicts.md
